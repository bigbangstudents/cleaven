<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Controlled Effects</title>

<style>
body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin-top: 20px;
}

button {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    background: #00c3ff;
    color: black;
    border-radius: 8px;
    cursor: pointer;
    margin: 20px;
}

#webcam-container {
    margin-top: 10px;
}

canvas {
    border-radius: 12px;
}

#effects {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.effect {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    animation: explode 0.8s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(3); opacity: 0; }
}

#loading {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}
</style>
</head>

<body>

<div id="loading">Loading Model...</div>

<h1>Gesture Controlled Effects</h1>
<button onclick="init()">Start Camera</button>

<div id="webcam-container"></div>
<div id="label-container"></div>
<div id="effects"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/ZEQHU-8Ai/";

let model, webcam, labelContainer, maxPredictions;
let lastTriggerTime = 0;
const cooldown = 1000; // 1 second cooldown

async function init() {
    try {
        document.getElementById("loading").style.display = "flex";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = window.innerWidth < 768;
        webcam = new tmImage.Webcam(300, 300, flip);

        await webcam.setup({ facingMode: "user" });
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }

        document.getElementById("loading").style.display = "none";

    } catch (error) {
        alert("Camera or Model failed to load.\nCheck permissions and model URL.");
        console.error(error);
    }
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    const predictions = await model.predict(webcam.canvas);

    let highest = predictions[0];

    for (let i = 1; i < predictions.length; i++) {
        if (predictions[i].probability > highest.probability) {
            highest = predictions[i];
        }
    }

    // Display predictions
    predictions.forEach((p, i) => {
        labelContainer.childNodes[i].innerHTML =
            p.className + ": " + p.probability.toFixed(2);
    });

    const now = Date.now();

    if (highest.probability > 0.90 && now - lastTriggerTime > cooldown) {
        triggerEffect(highest.className);
        lastTriggerTime = now;
    }
}

function triggerEffect(gesture) {
    const effectsContainer = document.getElementById("effects");

    const effect = document.createElement("div");
    effect.classList.add("effect");

    effect.style.left = Math.random() * window.innerWidth + "px";
    effect.style.top = Math.random() * window.innerHeight + "px";

    // Customize effects per gesture name
    switch (gesture) {
        case "Open":
            effect.style.background = "cyan";
            break;
        case "Fist":
            effect.style.background = "red";
            break;
        case "Peace":
            effect.style.background = "lime";
            break;
        default:
            effect.style.background = "yellow";
    }

    effectsContainer.appendChild(effect);

    setTimeout(() => effect.remove(), 800);
}
</script>

</body>
</html>
